<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHARKX CRM · what to build next</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7f9;--card:#fff;--ink:#16181d;--mut:#5b6472;--line:#e3e6ec;--soft:#f0f2f6;
--todo:#8f98a6;--doing:#2563eb;--done:#16a34a;--blocked:#d97706;--late:#dc2626;--accent:#2563eb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--ink:#e8eaee;--mut:#9aa3b2;--line:#272c37;--soft:#1c2029;
--todo:#7c8594;--doing:#5b95ff;--done:#34d399;--blocked:#fbbf24;--late:#f87171;--accent:#5b95ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px 56px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:16px;margin:34px 0 4px}
.lead{color:var(--mut);margin:0 0 14px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:10px 0 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:120px}
.stat b{display:block;font-size:22px;line-height:1.1}
.stat span{color:var(--mut);font-size:12.5px}
.bar{height:8px;border-radius:8px;background:var(--soft);overflow:hidden;margin-top:14px;display:flex}
.bar i{display:block;height:100%}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px;margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.who{font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
.title{font-size:20px;font-weight:700;margin:4px 0 2px}
.title small{font-weight:600;color:var(--mut);font-size:14px;margin-inline-end:6px}
.meta{color:var(--mut);font-size:13px;margin-bottom:10px}
.chip{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:650;color:#fff;background:var(--todo);white-space:nowrap}
.chip.doing{background:var(--doing)}.chip.done{background:var(--done)}.chip.blocked{background:var(--blocked);color:#1b1300}.chip.late{background:var(--late)}
.chip.ready{background:transparent;color:var(--done);border:1px solid var(--done)}
.chip.wait{background:transparent;color:var(--blocked);border:1px solid var(--blocked)}
ul.subs{list-style:none;margin:8px 0 0;padding:0}
ul.subs li{display:flex;gap:9px;align-items:baseline;padding:5px 0;border-top:1px solid var(--line);font-size:14px}
ul.subs i{width:10px;height:10px;border-radius:50%;background:var(--todo);flex:none;transform:translateY(1px)}
ul.subs i.doing{background:var(--doing)}ul.subs i.done{background:var(--done)}ul.subs i.blocked{background:var(--blocked)}
ul.subs em{color:var(--mut);font-style:normal;font-size:12.5px}
.path{font:12.5px ui-monospace,Menlo,Consolas,monospace;background:var(--soft);border-radius:6px;padding:2px 6px}
.after{margin-top:12px;font-size:13.5px;color:var(--mut)}
.after b{color:var(--ink)}
.none{color:var(--mut)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px;margin-top:8px}
th,td{text-align:start;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--soft);color:var(--mut);font-size:12.5px;font-weight:650}
tr:last-child td{border-bottom:0}
tr.isdone td{color:var(--mut)}
tr.isdone td.name{text-decoration:line-through;text-decoration-color:var(--line)}
td.id{font-weight:700;white-space:nowrap}
td.days{white-space:nowrap}
td small{display:block;color:var(--mut);font-size:12.5px}
.tablewrap{overflow-x:auto}
details{margin-top:10px}
summary{cursor:pointer;color:var(--mut);font-weight:600}
</style>
</head>
<body>
<main>
  <h1>SHARKX CRM · what to build next</h1>
  <p class="lead" id="sub"></p>
  <div class="top" id="top"></div>
  <div class="bar" id="bar" title="done / in progress / blocked / not started"></div>

  <h2>Build next</h2>
  <p class="lead">One spec per developer. "Ready" means everything it depends on is done.</p>
  <div class="cards" id="next"></div>

  <h2>Waiting on something</h2>
  <p class="lead">Not startable yet, and what each one waits for.</p>
  <div class="tablewrap"><table id="waiting"></table></div>

  <h2>Whole plan, by release</h2>
  <div id="roadmap"></div>
</main>
<script src="plan-data.js"></script>
<script src="../tracker/tracker-data.js" onerror="window.TRACKER=null"></script>
<script>
(function () {
  'use strict';
  var P = window.PLAN, T = window.TRACKER || null;
  var $ = function (id) { return document.getElementById(id); };
  if (!P) { $('sub').textContent = 'plan-data.js not found.'; return; }
  var DAY = 864e5, start = Date.parse(P.start + 'T00:00:00Z');
  var now = new Date();
  var today = Math.floor((Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) - start) / DAY) + 1;
  var byId = {}; P.specs.forEach(function (s) { byId[s.id] = s; });
  var subs = {};
  if (T && T.features) T.features.forEach(function (f) { f.subs.forEach(function (s) { subs[s.id] = s; }); });

  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
  function fmt(d, o) { return new Date(start + (d - 1) * DAY).toLocaleDateString('en-GB', Object.assign({ timeZone: 'UTC' }, o)); }
  var short = { weekday: 'short', day: 'numeric', month: 'short' };
  var who = function (o) { return o === 'Both' ? 'Both' : P.devs[o]; };
  function days(s) {
    return s.startDay === s.endDay ? 'Day ' + s.startDay + ' · ' + fmt(s.startDay, { day: 'numeric', month: 'short' })
      : 'Days ' + s.startDay + '–' + s.endDay + ' · ' + fmt(s.startDay, { day: 'numeric', month: 'short' }) + ' – ' + fmt(s.endDay, { day: 'numeric', month: 'short' });
  }

  // ---- status from the tracker's sub-features ----
  function subsOf(s) { return (s.subs || []).map(function (id) { return subs[id]; }).filter(Boolean); }
  function status(s) {
    var ss = subsOf(s);
    if (!ss.length) return 'todo';
    if (ss.every(function (x) { return x.status === 'done'; })) return 'done';
    if (ss.some(function (x) { return x.status === 'blocked'; }) && ss.every(function (x) { return x.status === 'done' || x.status === 'blocked'; })) return 'blocked';
    if (ss.some(function (x) { return x.status !== 'todo' || x.pct > 0; })) return 'doing';
    return 'todo';
  }
  // A dependency is met when it is done, or when all that is left of it is parked as blocked (e.g. Railway admin).
  function met(id) {
    var d = byId[id]; if (!d) return true;
    var st = status(d);
    if (st === 'done') return true;
    var ss = subsOf(d);
    return st === 'blocked' && ss.some(function (x) { return x.status === 'done'; });
  }
  function unmet(s) { return (s.dependsOn || []).filter(function (id) { return !met(id); }); }
  var label = { todo: 'not started', doing: 'in progress', done: 'done', blocked: 'blocked' };
  function chip(st) { return el('span', 'chip ' + st, label[st]); }
  function late(s) { return status(s) !== 'done' && s.endDay < today; }

  // ---- header ----
  var open = P.specs.filter(function (s) { return status(s) !== 'done'; });
  var c = { done: 0, doing: 0, blocked: 0, todo: 0 };
  P.specs.forEach(function (s) { c[status(s)]++; });
  var rel1 = P.milestones.filter(function (m) { return m.label.indexOf('Release 1') === 0; })[0];
  $('sub').textContent = 'Today is Day ' + Math.max(today, 1) + ' of ' + P.buildDays + ' build days (' +
    new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate())).toLocaleDateString('en-GB', Object.assign({ timeZone: 'UTC' }, { weekday: 'long', day: 'numeric', month: 'long' })) + ')' +
    (rel1 ? ' · Release 1 is due Day ' + rel1.day + ' (' + fmt(rel1.day, short) + ')' : '') +
    (T ? '' : ' · no tracker data: everything shows as not started');
  [['done', 'done'], ['doing', 'in progress'], ['todo', 'not started'], ['blocked', 'blocked']].forEach(function (x) {
    var s = el('div', 'stat'); s.append(el('b', '', String(c[x[0]])), el('span', '', 'specs ' + x[1])); $('top').append(s);
  });
  var late_n = P.specs.filter(late).length;
  if (late_n) { var ls = el('div', 'stat'); ls.append(el('b', '', String(late_n)), el('span', '', 'specs behind plan')); $('top').append(ls); }
  [['done', 'var(--done)'], ['doing', 'var(--doing)'], ['blocked', 'var(--blocked)']].forEach(function (x) {
    var i = el('i'); i.style.width = (100 * c[x[0]] / P.specs.length) + '%'; i.style.background = x[1]; $('bar').append(i);
  });

  // ---- build next, per developer ----
  function pick(dev) {
    var mine = open.filter(function (s) { return (s.owner === dev || s.owner === 'Both') && status(s) !== 'blocked'; });
    var ready = mine.filter(function (s) { return !unmet(s).length; });
    var order = function (a, b) { return (status(b) === 'doing') - (status(a) === 'doing') || a.startDay - b.startDay || a.endDay - b.endDay; };
    ready.sort(order);
    var rest = mine.filter(function (s) { return unmet(s).length; }).sort(function (a, b) { return a.startDay - b.startDay; });
    return { first: ready[0] || rest[0] || null, ready: ready, rest: rest };
  }
  ['A', 'B'].forEach(function (dev) {
    var p = pick(dev), card = el('div', 'card');
    card.append(el('div', 'who', 'Dev ' + dev + ' · ' + P.devs[dev]));
    var s = p.first;
    if (!s) { card.append(el('div', 'title', 'Nothing left to build'), el('div', 'none', 'Every spec for this developer is done or parked.')); $('next').append(card); return; }
    var t = el('div', 'title'); t.append(el('small', '', s.id), document.createTextNode(s.name)); card.append(t);
    var m = el('div', 'meta');
    var w = unmet(s);
    m.append(chip(status(s)), document.createTextNode(' '));
    m.append(w.length ? el('span', 'chip wait', 'waits for ' + w.join(', ')) : el('span', 'chip ready', 'ready now'));
    if (late(s)) m.append(document.createTextNode(' '), el('span', 'chip late', 'behind plan'));
    m.append(document.createTextNode('  Planned ' + days(s) + (s.release ? ' · Release ' + s.release : '')));
    card.append(m);
    if (s.what) card.append(el('div', 'meta', s.what));
    var ul = el('ul', 'subs');
    var ss = subsOf(s);
    if (!ss.length) ss = (s.subs || []).map(function (id) { return { id: id, name: id, status: 'todo', pct: 0, note: '' }; });
    ss.forEach(function (x) {
      var li = el('li'); li.append(el('i', x.status));
      var tx = el('span'); tx.append(document.createTextNode(x.id + '  ' + x.name));
      if (x.note) tx.append(el('em', '', ' · ' + x.note));
      li.append(tx); ul.append(li);
    });
    card.append(ul);
    if (s.note) card.append(el('div', 'after', s.note));
    var sp = el('div', 'after'); sp.append(document.createTextNode('Spec: '), el('span', 'path', 'docs/specs/' + s.id + '-*.md')); card.append(sp);
    var more = p.ready.concat(p.rest).filter(function (x) { return x !== s; }).sort(function (a, b) { return a.startDay - b.startDay; }).slice(0, 2);
    if (more.length) {
      var a = el('div', 'after'); a.append(document.createTextNode('Then: '));
      more.forEach(function (x, i) { if (i) a.append(document.createTextNode(' · ')); var xw = unmet(x); a.append(el('b', '', x.id), document.createTextNode(' ' + x.name + ' (' + fmt(x.startDay, { day: 'numeric', month: 'short' }) + (xw.length ? ', waits for ' + xw.join(', ') : ', ready') + ')')); });
      card.append(a);
    }
    $('next').append(card);
  });

  // ---- waiting ----
  var wt = $('waiting');
  var wh = el('tr'); ['Spec', 'Owner', 'Planned', 'Waits for'].forEach(function (h) { wh.append(el('th', '', h)); }); wt.append(wh);
  var waiting = open.filter(function (s) { return unmet(s).length && status(s) !== 'blocked'; }).sort(function (a, b) { return a.startDay - b.startDay; });
  var waitingAll = waiting.length; waiting = waiting.slice(0, 8);
  if (!waiting.length) { var r0 = el('tr'); var c0 = el('td', 'none', 'Nothing is waiting.'); c0.colSpan = 4; r0.append(c0); wt.append(r0); }
  waiting.forEach(function (s) {
    var r = el('tr'); var n = el('td', 'name'); n.append(el('b', '', s.id + '  '), document.createTextNode(s.name));
    var wf = el('td'); unmet(s).forEach(function (id, i) { if (i) wf.append(document.createTextNode(', ')); wf.append(el('b', '', id), document.createTextNode(' ' + byId[id].name + ' (' + who(byId[id].owner) + ', ' + label[status(byId[id])] + ')')); });
    r.append(n, el('td', '', who(s.owner)), el('td', 'days', days(s)), wf); wt.append(r);
  });

  if (waitingAll > waiting.length) { var mr = el('tr'); var mc = el('td', 'none', '+ ' + (waitingAll - waiting.length) + ' more, all listed in the plan below.'); mc.colSpan = 4; mr.append(mc); wt.append(mr); }

  // ---- roadmap by release ----
  var groups = (P.releases || []).map(function (r) { return { title: r.name, what: r.what, key: r.key, due: r.due }; }).concat([
    { title: 'Testing and handover', what: 'No new features. Security and connector tests, Arabic and French, browser tests, staging, backups and training.', key: null, max: 23 },
    { title: 'UAT and production go-live (outside the build)', what: 'SHARKX tests on live accounts, signs off, and the CRM goes live.', key: null, min: 24 }
  ]);
  groups.forEach(function (g) {
    var items = P.specs.filter(function (s) {
      if (g.key) return s.release === g.key;
      return s.release == null && (g.max ? s.endDay <= g.max : s.endDay >= g.min);
    }).sort(function (a, b) { return a.startDay - b.startDay || a.id.localeCompare(b.id); });
    if (!items.length) return;
    var doneN = items.filter(function (s) { return status(s) === 'done'; }).length;
    var d = el('details'); if (doneN < items.length && (g.key === 1 || g.key === 2 || (g.key == null && g.max))) d.open = g.key === 1 || doneN > 0 || items.some(function (s) { return status(s) === 'doing'; });
    var sm = el('summary', '', g.title + (g.due ? ' · due ' + fmt(g.due, short) : '') + ' · ' + doneN + ' of ' + items.length + ' done'); d.append(sm);
    if (g.what) d.append(el('p', 'lead', g.what));
    var wrap = el('div', 'tablewrap'), tb = el('table'), hr = el('tr');
    ['What it delivers', 'Spec', 'Owner', 'Planned', 'Status', 'Waits for'].forEach(function (h) { hr.append(el('th', '', h)); }); tb.append(hr);
    items.forEach(function (s) {
      var st = status(s), r = el('tr', st === 'done' ? 'isdone' : '');
      var n = el('td', 'name'); n.append(el('b', '', s.name)); if (s.what) n.append(el('small', '', s.what)); if (s.note) n.append(el('small', '', s.note)); r.append(n);
      r.append(el('td', 'id', s.id));
      r.append(el('td', '', who(s.owner)), el('td', 'days', days(s)));
      var sc = el('td'); sc.append(chip(st)); if (late(s)) sc.append(document.createTextNode(' '), el('span', 'chip late', 'behind')); r.append(sc);
      var u = unmet(s); var bn = subsOf(s).filter(function (x) { return x.status === 'blocked'; })[0];
      r.append(el('td', '', st === 'done' ? '' : st === 'blocked' && bn ? bn.note : u.length ? u.join(', ') : 'nothing: ready'));
      tb.append(r);
    });
    wrap.append(tb); d.append(wrap);
    $('roadmap').append(d);
  });
  // milestones
  var ml = el('p', 'lead'); ml.style.marginTop = '18px';
  ml.textContent = 'Milestones: ' + P.milestones.filter(function (m) { return m.day; }).sort(function (a, b) { return a.day - b.day; })
    .map(function (m) { return m.label + ' (Day ' + m.day + ', ' + fmt(m.day, { day: 'numeric', month: 'short' }) + ')'; }).join(' · ');
  $('roadmap').append(ml);
})();
</script>
</body>
</html>
